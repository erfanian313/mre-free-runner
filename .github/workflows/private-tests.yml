name: Private application tests only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private signal application
        uses: actions/checkout@v4
        with:
          repository: erfanian313/kn-telegram-signals
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-app
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: private-app/requirements.txt
      - name: Install test dependencies
        working-directory: private-app
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Compile all Python modules
        working-directory: private-app
        run: python -m compileall -q .
      - name: Run complete regression suite
        working-directory: private-app
        env:
          PYTHONPATH: .
        run: python -m pytest -q

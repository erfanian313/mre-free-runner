name: M.R.E Private Signal Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: mre-private-signal-runner
  cancel-in-progress: false

jobs:
  run-private-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private signal application
        uses: actions/checkout@v4
        with:
          repository: erfanian313/kn-telegram-signals
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-app
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: private-app/requirements.txt

      - name: Install runtime dependencies
        working-directory: private-app
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run private signal and membership monitor
        working-directory: private-app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: "false"
        shell: bash
        run: |
          set +e
          python main.py > "$RUNNER_TEMP/private-monitor.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "::error::Private monitor failed. Detailed output is suppressed to protect private user and trading data."
            exit "$result"
          fi
          echo "Private monitor completed. Detailed output is suppressed."

      - name: Persist private application state
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_state.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "Persist signal and membership state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::State rebase conflict; refusing to overwrite newer private state."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Private state persisted successfully."
              exit 0
            fi
            echo "Push race detected; retrying (${attempt}/3)."
          done
          echo "::error::Could not persist private state after three attempts."
          exit 1

# Reliability gate: run regression tests and reject malformed market data or invalid trade geometry before live scans.
name: M.R.E Private Signal Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-signal-runner.yml"
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: read

concurrency:
  group: mre-private-signal-runner
  cancel-in-progress: false

jobs:
  run-private-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private signal application
        uses: actions/checkout@v4
        with:
          repository: erfanian313/kn-telegram-signals
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-app
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: private-app/requirements.txt

      - name: Install runtime dependencies
        working-directory: private-app
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run private application tests
        working-directory: private-app
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run private signal and membership monitor
        working-directory: private-app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: "false"
        shell: bash
        run: |
          set +e
          python main.py > "$RUNNER_TEMP/private-monitor.log" 2>&1
          result=$?
          python - "$RUNNER_TEMP/private-monitor.log" "$TELEGRAM_BOT_TOKEN" <<'PY'
          import re, sys
          from collections import Counter

          path, token = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8", errors="replace") as stream:
              lines = stream.readlines()

          sources = Counter()
          candidates = Counter()
          no_data = []
          processing_errors = []
          live_errors = []
          telegram_errors = 0
          queued = 0
          completed = False

          for raw in lines:
              line = raw.replace(token, "[REDACTED]") if token else raw
              match = re.search(r"market data source=(BiQuote|Yahoo fallback|Dukascopy fallback)", line)
              if match:
                  sources[match.group(1)] += 1
              match = re.search(r"Signal candidate: (SMC|ICT|KN \| EMA) ([A-Z]{6})", line)
              if match:
                  candidates[match.group(1)] += 1
              match = re.search(r"^([A-Z]{6}): no candles from any free source", line)
              if match:
                  no_data.append(match.group(1))
              match = re.search(r"Error processing ([A-Z]{6}):", line)
              if match:
                  processing_errors.append(match.group(1))
              match = re.search(r"Priority live monitoring error for ([A-Z]{6}):", line)
              if match:
                  live_errors.append(match.group(1))
              if "Telegram update polling error:" in line:
                  telegram_errors += 1
              if "Telegram notification remains queued:" in line:
                  queued += 1
              if "Signal and membership monitoring completed." in line:
                  completed = True

          print("=== M.R.E monitor health summary ===")
          print(f"Market data source successes: {dict(sources)}")
          print(f"Signal candidates detected: {dict(candidates)}")
          print(f"Symbols with no usable market data: {len(set(no_data))} {sorted(set(no_data))}")
          print(f"Symbol processing errors: {len(processing_errors)} {sorted(set(processing_errors))}")
          print(f"Live-position monitoring errors: {len(live_errors)} {sorted(set(live_errors))}")
          print(f"Telegram polling errors: {telegram_errors}")
          print(f"Telegram notifications still queued: {queued}")
          print(f"Monitor reached normal completion: {completed}")
          PY
          if [ "$result" -ne 0 ]; then
            echo "::error::Private monitor failed. See the sanitized health summary above."
            exit "$result"
          fi
          echo "Private monitor completed."

      - name: Persist private application state
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_state.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "Persist signal and membership state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::State rebase conflict; refusing to overwrite newer private state."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Private state persisted successfully."
              exit 0
            fi
            echo "Push race detected; retrying (${attempt}/3)."
          done
          echo "::error::Could not persist private state after three attempts."
          exit 1

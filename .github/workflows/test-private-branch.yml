name: Temporary private branch regression tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-private-branch.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: erfanian313/kn-telegram-signals
          ref: fix/coalesce-trade-level-alerts-20261119
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        working-directory: private-app
        run: python -m pip install -r requirements.txt pytest
      - name: Run complete private application test suite
        working-directory: private-app
        run: python -m pytest -q
